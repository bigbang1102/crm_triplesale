# SonarQube - triple_sales_web (Angular) ; กติกาอยู่ใน CLAUDE.md หัวข้อ "มาตรฐาน SonarQube"
# ห้ามใส่ sonar.token / รหัสผ่านในไฟล์นี้ - ส่งผ่าน SONAR_TOKEN หรือ -Dsonar.token
# sonar.host.url ตั้งผ่าน SONAR_HOST_URL หรือ -Dsonar.host.url
sonar.projectKey=triple-sale-angular
sonar.projectName=triple-sale-angular
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts

# ตัดออก: ไฟล์ที่ถูกสร้าง/ของบุคคลที่สาม/ผล build (ปัญหาในไฟล์สร้างแก้ที่ tools/sync-*.mjs)
sonar.exclusions=\
  **/*.spec.ts,\
  **/*.engine.ts,\
  **/*.generated.ts,\
  **/node_modules/**,\
  dist/**,\
  .angular/**,\
  .compare/**,\
  public/assets/vendor/**,\
  public/assets/java-js/**,\
  public/assets/js/frames/**,\
  public/assets/i18n/**

# โค้ดซ้ำ: ไม่นับไฟล์ข้อความแปลและข้อมูลจำลอง
sonar.cpd.exclusions=**/*.mock.ts,**/*.mock.gold.ts,**/*.json

# Coverage - ต้องเปิดการสร้าง lcov ของ unit-test ก่อน (ยังไม่ได้ตั้ง) ; ถ้าไม่มีไฟล์นี้ Sonar จะรายงาน coverage 0%
# FAST-DEBT(STD): ยังไม่ได้เปิดสร้าง coverage (lcov) ใน unit-test builder ของ angular.json · Sonar จึงเห็น coverage 0% · เปิดแล้วให้ลบป้ายนี้ · somyot · 2026-11-19
sonar.javascript.lcov.reportPaths=coverage/lcov.info
