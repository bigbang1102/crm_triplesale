# ประตู https ของ Datasource + Storage ของ mockup — พอร์ตของตัวเอง (7339) แยกจาก nginx-gateway ของเว็บอื่นทั้งหมด
#
#  ทำไมแยก : เดิมเพิ่ม location ใน vhost 52339 ที่ใช้ร่วมกับ AI HUB (คิดเงินตาม token) และ Triple Sale CRM → ชื่อโดเมน+พอร์ตเดียวกัน
#  เส้นทางของ mockup จึงปนกับของระบบอื่น ; อีกทั้งการเพิ่มพอร์ตใหม่ใน nginx-gateway ต้อง recreate container ซึ่งตัดทุกเว็บและเสี่ยงพอร์ต
#  523xx/623xx (ช่วง ephemeral ของ Windows) โดนแย่ง — ตัวนี้เป็น container ของ mockup เอง เพิ่ม/แก้/รีสตาร์ตได้โดยไม่กระทบใคร
#
#  7339 : เลขพอร์ตมี 5 หลักขึ้นต้นด้วย 7 ไม่ได้ (พอร์ต TCP สูงสุด 65535) จึงใช้ 4 หลัก ; ไม่อยู่ในช่วง ephemeral (49152+) ของ Windows
#  ใบรับรอง *.acecloud.co.th ตัวเดียวกับ nginx-gateway (mount อ่านอย่างเดียวจาก MOCKUP_CERT_DIR)
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    server_tokens off;

    server {
        listen       7339 ssl;
        server_name  acedemo.acecloud.co.th;

        ssl_certificate      /etc/nginx/cert/star_acecloud_co_th.crt;
        ssl_certificate_key  /etc/nginx/cert/star_acecloud_co_th.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # เฉพาะ 3 เส้นของ mockup — อย่างอื่นไม่มีอะไรให้ (ไม่ใช่ AI HUB / CRM)
        # service name `mockup-data` = container เซิร์ฟเวอร์ไฟล์ในเครือข่ายเดียวกันของ compose นี้ (ไม่ผ่าน IP ของโฮสต์ จึงไม่ติดเรื่องวง LAN)
        location ~ ^/(mockup-api|mockup-idp|mockup-tps)(/|$) {
            proxy_pass         http://mockup-data:4310;
            proxy_http_version 1.1;
            proxy_set_header   Host              $http_host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # ไฟล์แนบอัปโหลดผ่านตรงนี้ (ตัว server จำกัด 50MB) ; ไม่ buffer ขาเข้าเพื่อไม่ให้ไฟล์ใหญ่เต็มดิสก์ชั่วคราว
            proxy_request_buffering off;
            client_max_body_size 60M;
            proxy_read_timeout 60;
            proxy_send_timeout 60;
        }

        location / { return 404; }
    }
}
