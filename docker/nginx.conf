# nginx ใน container ของ Triple Sales web — เสิร์ฟไฟล์ static ของ Angular (SPA) + reverse proxy ไป API
# (เหมือน proxy.conf.json ของ ng serve: gateway ไม่เปิด CORS ให้ origin อื่น เบราว์เซอร์จึงต้องเรียกผ่าน origin เดียวกับเว็บ)
server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip            on;
    gzip_min_length 1024;
    gzip_types      text/css application/javascript application/json image/svg+xml;

    resolver                127.0.0.11 valid=30s ipv6=off;
    client_max_body_size    16m;

    # /tps-api/...  -> https://dev-tps.acecloud.co.th/...   (triplesale-service + หา group ของ Keycloak)
    location /tps-api/ {
        set                     $up https://dev-tps.acecloud.co.th;
        rewrite                 ^/tps-api/(.*)$ /$1 break;
        proxy_pass              $up;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_set_header        Host dev-tps.acecloud.co.th;
        proxy_set_header        Authorization $http_authorization;
        proxy_read_timeout      60s;
    }

    # /triplesale-auth, /dashboard-triplesale-service -> uattriplesaleo2o (path เดิม)
    location ~ ^/(?:triplesale-auth|dashboard-triplesale-service)/ {
        set                     $up https://uattriplesaleo2o.acecloud.co.th;
        proxy_pass              $up;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_set_header        Host uattriplesaleo2o.acecloud.co.th;
        proxy_set_header        Authorization $http_authorization;
        proxy_read_timeout      60s;
    }

    # /ts-files/... -> uattriplesaleo2o (ตัด prefix)
    location /ts-files/ {
        set                     $up https://uattriplesaleo2o.acecloud.co.th;
        rewrite                 ^/ts-files/(.*)$ /$1 break;
        proxy_pass              $up;
        proxy_http_version      1.1;
        proxy_ssl_server_name   on;
        proxy_set_header        Host uattriplesaleo2o.acecloud.co.th;
        proxy_set_header        Authorization $http_authorization;
    }

    # /master-service/... -> master service บนเครื่อง host (พอร์ต 8085, ตัด prefix + header เหมือน proxy.conf.json)
    location /master-service/ {
        set                     $up http://host.docker.internal:8085;
        rewrite                 ^/master-service/(.*)$ /$1 break;
        proxy_pass              $up;
        proxy_set_header        X-Roles "SCONF";
        proxy_set_header        X-Entity-Ids "*";
        proxy_set_header        Authorization $http_authorization;
    }

    # หน้าเข้า + ไฟล์ตั้งค่า: ห้ามแคช (แก้ config แล้วเห็นทันที / ออก build ใหม่แล้วไม่ค้างของเก่า)
    location = /index.html { add_header Cache-Control "no-store"; }
    location /config/      { add_header Cache-Control "no-store"; try_files $uri =404; }

    # js/css ชื่อไฟล์มี hash (outputHashing=all) — แคชยาวได้
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ไฟล์อื่นที่มีนามสกุล: ไม่มีจริง = 404 (ไม่ตกไป index.html)
    location ~ \.[A-Za-z0-9]+$ { try_files $uri =404; }

    # route ของ Angular (/crm/home, /auth/callback ...) -> index.html
    location / { try_files $uri $uri/ /index.html; }
}
